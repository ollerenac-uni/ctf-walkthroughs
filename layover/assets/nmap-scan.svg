<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="system-ui, sans-serif">
  <rect width="820" height="300" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#0f172a">Cómo funciona un escaneo de puertos (nmap)</text>
  <text x="30" y="62" font-size="14" fill="#64748b">nmap envía un paquete a cada puerto y lo clasifica según cómo responde.</text>

  <!-- ABIERTO -->
  <rect x="30" y="86" width="232" height="190" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <rect x="46" y="104" width="200" height="30" rx="6" fill="#059669"/>
  <text x="146" y="124" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">PUERTO ABIERTO</text>
  <text x="50" y="168" font-size="12" fill="#1e293b" font-family="ui-monospace, monospace">nmap → SYN → :22</text>
  <text x="50" y="192" font-size="12" fill="#1e293b" font-family="ui-monospace, monospace">:22 → SYN/ACK → nmap</text>
  <text x="50" y="236" font-size="13" font-weight="600" fill="#065f46">Algo escucha ahí.</text>

  <!-- CERRADO -->
  <rect x="294" y="86" width="232" height="190" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <rect x="310" y="104" width="200" height="30" rx="6" fill="#dc2626"/>
  <text x="410" y="124" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">PUERTO CERRADO</text>
  <text x="314" y="168" font-size="12" fill="#1e293b" font-family="ui-monospace, monospace">nmap → SYN → :81</text>
  <text x="314" y="192" font-size="12" fill="#1e293b" font-family="ui-monospace, monospace">:81 → RST → nmap</text>
  <text x="314" y="236" font-size="13" font-weight="600" fill="#991b1b">Nada escucha; lo rechaza.</text>

  <!-- FILTRADO -->
  <rect x="558" y="86" width="232" height="190" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <rect x="574" y="104" width="200" height="30" rx="6" fill="#d97706"/>
  <text x="674" y="124" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">PUERTO FILTRADO</text>
  <text x="578" y="168" font-size="12" fill="#1e293b" font-family="ui-monospace, monospace">nmap → SYN → :445</text>
  <text x="578" y="192" font-size="12" fill="#64748b" font-family="ui-monospace, monospace">(sin respuesta)</text>
  <text x="578" y="236" font-size="13" font-weight="600" fill="#92400e">Un firewall lo descarta.</text>
</svg>
