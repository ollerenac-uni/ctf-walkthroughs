site_name: "CTF Walkthroughs"
site_description: "Colección de walkthroughs de CTF centrados en el razonamiento, por tácticas MITRE ATT&CK."
site_url: https://ollerenac-uni.github.io/ctf-walkthroughs/
docs_dir: docs
site_dir: site

# Estas páginas (la cadena de explotación hasta root) no se publican en el sitio.
# Se quedan en el repo pero MkDocs NO las construye: sus URLs devuelven 404 online.
exclude_docs: |
  layover/03-exploitation.md
  layover/04-credenciales.md
  layover/05-lateral.md
  layover/06-privesc.md

theme:
  name: material
  language: es
  font:
    text: JetBrains Mono
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Inicio: index.md
  - "Layover · HTB":
      - layover/index.md
      - "Conceptos necesarios": layover/conceptos.md
      - "Etapa 0 · Setup": layover/etapa0-setup.md
      - Tácticas:
          - "1 · Discovery": layover/01-discovery.md
          - "2 · Network Sniffing": layover/02-monitoreo.md
      - "Tarea · Tu blog del walkthrough": layover/tarea.md
  - "C2 · Web":
      - c2-web/index.md
      - "Conceptos (30 min)": c2-web/conceptos.md
      - "Mini-labs": c2-web/mini-labs.md
      - "CTF1 · Juice Shop": c2-web/ctf1-juice-shop.md
      - "CTF2 · WebGoat": c2-web/ctf2-webgoat.md
