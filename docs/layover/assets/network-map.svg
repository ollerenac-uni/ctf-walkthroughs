<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="system-ui, sans-serif">
  <rect width="820" height="440" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">Mapa de red desde airside-ws01</text>
  <text x="30" y="58" font-size="13" fill="#64748b">La propia máquina, multi-homed, revela la red objetivo sin necesidad de escanear.</text>

  <!-- central host -->
  <rect x="320" y="180" width="180" height="80" rx="12" fill="#1e293b"/>
  <text x="410" y="212" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">airside-ws01</text>
  <text x="410" y="234" font-size="12" fill="#cbd5e1" text-anchor="middle">(root — tu plataforma)</text>

  <!-- left: infra net -->
  <line x1="320" y1="220" x2="180" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <text x="250" y="160" font-size="11" fill="#64748b" transform="rotate(-24 250 160)">eth0</text>
  <rect x="30" y="80" width="200" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="130" y="110" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">10.159.143.0/24</text>
  <text x="130" y="132" font-size="12" fill="#64748b" text-anchor="middle">infra HTB (por aquí la VPN)</text>
  <text x="130" y="150" font-size="11" fill="#94a3b8" text-anchor="middle">NO es el terreno de juego</text>

  <!-- right: wifi target net -->
  <line x1="500" y1="220" x2="640" y2="120" stroke="#0d9488" stroke-width="2.5"/>
  <text x="560" y="160" font-size="11" fill="#0f766e" transform="rotate(24 560 160)">wlan2 (10.13.37.182)</text>
  <rect x="560" y="60" width="240" height="150" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="680" y="88" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">WiFi abierta 10.13.37.0/24</text>
  <text x="680" y="108" font-size="12" fill="#115e59" text-anchor="middle">"HTB International WiFi"</text>
  <rect x="578" y="122" width="204" height="30" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="680" y="142" font-size="12" fill="#134e4a" text-anchor="middle" font-family="ui-monospace, monospace">portal → 10.13.37.10</text>
  <rect x="578" y="160" width="204" height="30" rx="6" fill="#ffffff" stroke="#5eead4"/>
  <text x="680" y="180" font-size="12" fill="#134e4a" text-anchor="middle" font-family="ui-monospace, monospace">gateway → 10.13.37.1</text>

  <!-- wlan3 monitor -->
  <line x1="410" y1="260" x2="410" y2="330" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="300" y="330" width="220" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="410" y="358" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle">wlan3 — 2ª WiFi simulada</text>
  <text x="410" y="378" font-size="12" fill="#5b21b6" text-anchor="middle">driver mac80211_hwsim</text>
  <text x="410" y="394" font-size="11" fill="#7c3aed" text-anchor="middle">(caída / sin asociar)</text>
</svg>
