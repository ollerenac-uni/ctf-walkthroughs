<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" font-family="system-ui, sans-serif">
  <rect width="860" height="700" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">Cadena completa por táctica (MITRE)</text>

  <g>
    <!-- stage 0 -->
    <circle cx="55" cy="95" r="22" fill="#64748b"/><text x="55" y="102" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">0</text>
    <rect x="95" y="68" width="720" height="54" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="112" y="90" font-size="15" font-weight="700" fill="#334155">Setup (no es el reto)</text>
    <text x="112" y="110" font-size="13" fill="#475569">VPN + RDP + sudo dado → shell root en airside-ws01 (tu plataforma de ataque)</text>

    <!-- stage 1 -->
    <circle cx="55" cy="175" r="22" fill="#2563eb"/><text x="55" y="182" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <rect x="95" y="148" width="720" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="112" y="170" font-size="15" font-weight="700" fill="#1d4ed8">Discovery (T1016/T1046)</text>
    <text x="112" y="190" font-size="13" fill="#475569">ip a / arp -a → WiFi abierta 10.13.37.0/24 + hosts (portal, gateway)</text>

    <!-- stage 2 -->
    <circle cx="55" cy="255" r="22" fill="#0d9488"/><text x="55" y="262" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <rect x="95" y="228" width="720" height="54" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <text x="112" y="250" font-size="15" font-weight="700" fill="#0f766e">Network Sniffing (T1040)</text>
    <text x="112" y="270" font-size="13" fill="#475569">wlan3 monitor + tshark → jenny : Fl1ghtDeck2026! (HTTP en claro)</text>

    <!-- stage 3 -->
    <circle cx="55" cy="335" r="22" fill="#dc2626"/><text x="55" y="342" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <rect x="95" y="308" width="720" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="112" y="330" font-size="15" font-weight="700" fill="#b91c1c">Execution / Exploitation (T1190→T1203)</text>
    <text x="112" y="350" font-size="13" fill="#475569">Craft 5.9.8 + CVE-2026-44011 (behavior-injection Yii2) → RCE www-data</text>

    <!-- stage 4 -->
    <circle cx="55" cy="415" r="22" fill="#d97706"/><text x="55" y="422" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <rect x="95" y="388" width="720" height="54" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="112" y="410" font-size="15" font-weight="700" fill="#b45309">Credential Access / Unsecured (T1552)</text>
    <text x="112" y="430" font-size="13" fill="#475569">.env (security key) + BD cifrada → descifrar → aporter : Skyp0rt_Relay!26</text>

    <!-- stage 5 -->
    <circle cx="55" cy="495" r="22" fill="#7c3aed"/><text x="55" y="502" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <rect x="95" y="468" width="720" height="54" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="112" y="490" font-size="15" font-weight="700" fill="#6d28d9">Lateral Movement (T1021/T1078)</text>
    <text x="112" y="510" font-size="13" fill="#475569">SSH como aporter (otro host, otra identidad) → USER FLAG</text>

    <!-- stage 6 -->
    <circle cx="55" cy="575" r="22" fill="#059669"/><text x="55" y="582" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">6</text>
    <rect x="95" y="548" width="720" height="54" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
    <text x="112" y="570" font-size="15" font-weight="700" fill="#047857">Privilege Escalation (T1068)</text>
    <text x="112" y="590" font-size="13" fill="#475569">CUPS 2.4.16 CVE-2026-34990 → escribe /etc/sudoers.d/aporter → ROOT FLAG</text>

    <!-- connectors -->
    <g stroke="#cbd5e1" stroke-width="2">
      <line x1="55" y1="117" x2="55" y2="153"/>
      <line x1="55" y1="197" x2="55" y2="233"/>
      <line x1="55" y1="277" x2="55" y2="313"/>
      <line x1="55" y1="357" x2="55" y2="393"/>
      <line x1="55" y1="437" x2="55" y2="473"/>
      <line x1="55" y1="517" x2="55" y2="553"/>
    </g>
  </g>
  <text x="30" y="650" font-size="14" font-style="italic" fill="#64748b">Ningún paso fue "el exploit mágico": fue encadenar debilidades pequeñas.</text>
</svg>
